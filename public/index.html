<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjectOS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">◈</span>
      <span>ProjectOS</span>
    </div>

    <nav class="types" id="typeTabs" aria-label="对象类型"></nav>

    <div class="topbar-right">
      <input class="search" id="searchInput" type="search" autocomplete="off"
             placeholder="搜索标题、属性、标签，或粘贴 id" aria-label="搜索">
      <span class="poll-dot" id="pollDot" title="自动刷新中"></span>
      <button class="btn" id="newBtn">+ 新建</button>
      <button class="identity" id="identityBtn" title="切换身份">
        <span id="identityLabel">—</span>
      </button>
    </div>
  </header>

  <main class="board" id="board" aria-live="polite"></main>

  <!-- 详情抽屉 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <div>
        <div class="drawer-type" id="drawerType"></div>
        <h2 id="drawerTitle"></h2>
      </div>
      <button class="icon-btn" id="drawerClose" aria-label="关闭">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- 新建 / 身份 弹窗 -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="关闭">×</button>
      </div>
      <form id="modalForm" class="modal-body"></form>
      <div class="modal-foot">
        <button class="btn ghost" id="modalCancel" type="button">取消</button>
        <button class="btn primary" id="modalSubmit" type="button">确定</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
